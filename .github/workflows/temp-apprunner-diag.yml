# TEMPORARY — read-only diagnostic while deploy run 33489550688 (PR #37's dry-run merge)
# is stuck "in progress" past its 45-minute job timeout. Checks App Runner service state
# directly (the most likely place a deploy hangs, per deploy.sh's own wait_for_apprunner_service
# comments) without touching anything. Triggers on push to this exact file since
# workflow_dispatch isn't available to this session's token. Remove once the stuck run is
# understood.

name: TEMP - App Runner state diagnostic

on:
  push:
    paths:
      - ".github/workflows/temp-apprunner-diag.yml"

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Check App Runner services + NAT Gateway state
        run: |
          set +e
          echo "## App Runner services (aeon-api, aeon-web)"
          aws apprunner list-services --query "ServiceSummaryList[?starts_with(ServiceName, 'aeon-')].[ServiceName,Status,ServiceArn]" --output table

          echo
          echo "## aeon-api detail"
          API_ARN=$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='aeon-api'].ServiceArn | [0]" --output text)
          if [ -n "$API_ARN" ] && [ "$API_ARN" != "None" ]; then
            aws apprunner describe-service --service-arn "$API_ARN" --query 'Service.[Status,StatusChangeReason]' --output table
            echo "Operations (most recent):"
            aws apprunner list-operations --service-arn "$API_ARN" --max-results 5 --query 'OperationSummaryList[].[Id,Type,Status,StartedAt,EndedAt]' --output table
          else
            echo "aeon-api service not found"
          fi

          echo
          echo "## aeon-web detail"
          WEB_ARN=$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='aeon-web'].ServiceArn | [0]" --output text)
          if [ -n "$WEB_ARN" ] && [ "$WEB_ARN" != "None" ]; then
            aws apprunner describe-service --service-arn "$WEB_ARN" --query 'Service.[Status,StatusChangeReason]' --output table
            echo "Operations (most recent):"
            aws apprunner list-operations --service-arn "$WEB_ARN" --max-results 5 --query 'OperationSummaryList[].[Id,Type,Status,StartedAt,EndedAt]' --output table
          else
            echo "aeon-web service not found"
          fi

          echo
          echo "## NAT Gateway state (untouched by this diagnostic)"
          aws ec2 describe-nat-gateways --filter "Name=tag:Name,Values=aeon-nat" \
            --query 'NatGateways[].[NatGatewayId,State,FailureCode,FailureMessage]' --output table

          echo
          echo "## Private route table default route"
          RT_ID=$(aws ec2 describe-route-tables --filters "Name=tag:Name,Values=aeon-private-rt" --query 'RouteTables[0].RouteTableId' --output text)
          if [ -n "$RT_ID" ] && [ "$RT_ID" != "None" ]; then
            aws ec2 describe-route-tables --route-table-ids "$RT_ID" --query "RouteTables[0].Routes[?DestinationCidrBlock=='0.0.0.0/0']" --output table
          fi
