# TEMPORARY — narrowing further: the connector-side routing/SG/NACL to the NAT Gateway
# all check out clean, and NAT Gateway metrics during the failing request showed packets
# going OUT (420 bytes, 7 packets) but functionally no response (same connect-timeout
# signature as before the swap). That points upstream of the NAT Gateway: does its own
# subnet actually have a working route to an Internet Gateway, and is the IGW attached
# and the EIP genuinely public? Checking all of that directly. Remove once root-caused.

name: TEMP - Internet Gateway diagnostic

on:
  push:
    paths:
      - ".github/workflows/temp-igw-diag.yml"

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: IGW + NAT subnet diagnostic
        run: |
          set +e
          VPC_ID=vpc-0ad519ae8fcdeed0e
          NAT_SUBNET=subnet-09d6760c73584d4b3

          echo "## 1. Internet Gateways attached to this VPC"
          aws ec2 describe-internet-gateways --filters "Name=attachment.vpc-id,Values=$VPC_ID" \
            --query 'InternetGateways[].[InternetGatewayId,Attachments]' --output json

          echo
          echo "## 2. Route table for the NAT Gateway's OWN subnet ($NAT_SUBNET)"
          aws ec2 describe-route-tables --filters "Name=association.subnet-id,Values=$NAT_SUBNET" \
            --query 'RouteTables[].[RouteTableId,Routes,Associations]' --output json

          echo
          echo "## 3. Is the NAT subnet's route table the main (default) VPC route table, or explicit?"
          aws ec2 describe-route-tables --filters "Name=vpc-id,Values=$VPC_ID" \
            --query 'RouteTables[].[RouteTableId,Associations[?Main==`true`].Main | [0], Routes[?DestinationCidrBlock==`0.0.0.0/0`]]' --output json

          echo
          echo "## 4. NAT Gateway's Elastic IP details"
          aws ec2 describe-nat-gateways --filter "Name=tag:Name,Values=aeon-nat" "Name=state,Values=available" \
            --query 'NatGateways[0].NatGatewayAddresses' --output json

          echo
          echo "## 5. That EIP's allocation details (is it actually a public IP, unassociated elsewhere, etc)"
          EIP_ALLOC=$(aws ec2 describe-nat-gateways --filter "Name=tag:Name,Values=aeon-nat" "Name=state,Values=available" \
            --query 'NatGateways[0].NatGatewayAddresses[0].AllocationId' --output text)
          echo "Allocation ID: $EIP_ALLOC"
          aws ec2 describe-addresses --allocation-ids "$EIP_ALLOC" --output json

          echo
          echo "## 6. VPC's main route table explicitly (default for any subnet without explicit association)"
          aws ec2 describe-route-tables --filters "Name=vpc-id,Values=$VPC_ID" "Name=association.main,Values=true" \
            --query 'RouteTables[0].[RouteTableId,Routes]' --output json

          echo
          echo "## 7. All subnets in the VPC and their CIDR + AZ (sanity check for overlap/misconfiguration)"
          aws ec2 describe-subnets --filters "Name=vpc-id,Values=$VPC_ID" \
            --query 'Subnets[].[SubnetId,CidrBlock,AvailabilityZone,MapPublicIpOnLaunch]' --output table
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
