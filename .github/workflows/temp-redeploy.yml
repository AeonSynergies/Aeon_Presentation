# TEMPORARY — re-runs deploy.sh directly (bypassing the need for a push to main, which
# this session's GitHub token cannot trigger via workflow_dispatch or a job re-run) now
# that ec2:ReplaceRoute has been granted. deploy.sh is fully idempotent, so this has the
# exact same effect as a fresh push to main would: it re-points the private route table
# at the already-created new NAT Gateway (nat-0fec854a1f61ba4e7), then redeploys both
# App Runner services. Mirrors deploy-aws.yml's "deploy" job exactly (same command, same
# secrets). Triggers on push to this exact file since workflow_dispatch isn't available
# to this session's token. Remove once the NAT Gateway fix is verified live.

name: TEMP - Re-run deploy.sh (route table fix retry)

on:
  push:
    paths:
      - ".github/workflows/temp-redeploy.yml"

permissions:
  contents: read

jobs:
  redeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Provision (idempotent) + build + deploy
        id: deploy
        run: |
          set -euo pipefail
          ./infra/aws/deploy.sh | tee /tmp/deploy.log
          API_URL=$(grep -oP '(?<= api: )\S+' /tmp/deploy.log | tail -1)
          WEB_URL=$(grep -oP '(?<= web: )\S+' /tmp/deploy.log | tail -1)
          AI_CONFIGURED=$(grep -oP '(?<= ai_configured: )\S+' /tmp/deploy.log | tail -1)
          AZURE_CONFIGURED=$(grep -oP '(?<= azure_configured: )\S+' /tmp/deploy.log | tail -1)
          if [ -z "$API_URL" ] || [ -z "$WEB_URL" ]; then
            echo "::error::deploy.sh reported success but didn't print both service URLs — treating as a failure."
            exit 1
          fi
          {
            echo "## Deployed"
            echo "- api: $API_URL"
            echo "- web: $WEB_URL"
            echo "- AI drafting configured: ${AI_CONFIGURED:-false}"
            echo "- Microsoft sign-in configured: ${AZURE_CONFIGURED:-false}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "web_url=$WEB_URL" >> "$GITHUB_OUTPUT"
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "ai_configured=${AI_CONFIGURED:-false}" >> "$GITHUB_OUTPUT"
          echo "azure_configured=${AZURE_CONFIGURED:-false}" >> "$GITHUB_OUTPUT"
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
