name: Deploy to AWS

# Pushes to main build both images from their Dockerfiles (never an auto-detected
# buildpack — see apps/*/Dockerfile), push to ECR, and deploy to App Runner. Also
# runnable manually (workflow_dispatch) — the underlying script is fully idempotent, so
# re-running it is how the one-time infrastructure bootstrap (RDS, ElastiCache, IAM,
# VPC connector) happens too: there's a single script, not a separate one-off setup path.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      web_url: ${{ steps.deploy.outputs.web_url }}
      api_url: ${{ steps.deploy.outputs.api_url }}
      ai_configured: ${{ steps.deploy.outputs.ai_configured }}
      azure_configured: ${{ steps.deploy.outputs.azure_configured }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Provision (idempotent) + build + deploy
        id: deploy
        # GitHub's default shell for a `run:` block is `bash -e {0}` — no `pipefail` — so
        # `deploy.sh | tee log` would report tee's exit code (always 0), silently masking
        # a real failure in deploy.sh. Setting pipefail explicitly is what makes this step
        # actually fail when the script does, instead of printing a blank summary and a
        # green checkmark (which is exactly what happened before this was added).
        run: |
          set -euo pipefail
          ./infra/aws/deploy.sh | tee /tmp/deploy.log
          API_URL=$(grep -oP '(?<= api: )\S+' /tmp/deploy.log | tail -1)
          WEB_URL=$(grep -oP '(?<= web: )\S+' /tmp/deploy.log | tail -1)
          AI_CONFIGURED=$(grep -oP '(?<= ai_configured: )\S+' /tmp/deploy.log | tail -1)
          AZURE_CONFIGURED=$(grep -oP '(?<= azure_configured: )\S+' /tmp/deploy.log | tail -1)
          if [ -z "$API_URL" ] || [ -z "$WEB_URL" ]; then
            echo "::error::deploy.sh reported success but didn't print both service URLs — treating as a failure."
            exit 1
          fi
          {
            echo "## Deployed"
            echo "- api: $API_URL"
            echo "- web: $WEB_URL"
            echo "- AI drafting configured: ${AI_CONFIGURED:-false}"
            echo "- Microsoft sign-in configured: ${AZURE_CONFIGURED:-false}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "web_url=$WEB_URL" >> "$GITHUB_OUTPUT"
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "ai_configured=${AI_CONFIGURED:-false}" >> "$GITHUB_OUTPUT"
          echo "azure_configured=${AZURE_CONFIGURED:-false}" >> "$GITHUB_OUTPUT"
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          # Phase 3a (AI-assisted deck drafting). Optional on purpose: deploy.sh stores
          # this in SSM only when it's set, and reuses whatever's already stored otherwise
          # — so a repo without this secret still deploys fine, just with AI drafting
          # disabled (ai.draftDeck returns a clear "not configured" error) until it's added.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Phase 4a Part 1 ("Sign in with Microsoft"). Same optional-until-configured
          # pattern as ANTHROPIC_API_KEY: all three are needed together before Microsoft
          # sign-in counts as configured (see deploy.sh) — until then it stays hidden
          # (auth.config reports microsoftEnabled: false) rather than failing the deploy.
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

  # Live end-to-end checks against the deployment that just went out, through a real
  # browser. Both scripts are idempotent (see their own headers) so re-deploys don't pile
  # up duplicate test data — this is the permanent "verify live, not just a green build"
  # gate: a deploy whose app is broken (wizard, pricing, or role enforcement) fails here
  # instead of looking green.
  live-e2e:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        working-directory: infra/e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium --with-deps

      - name: Run live wizard E2E against the deployment
        working-directory: infra/e2e
        run: node wizard-e2e.mjs
        env:
          BASE_URL: ${{ needs.deploy.outputs.web_url }}

      # Present-mode Discovery Notes popout window (safety fix): confirms Discovery Notes
      # is genuinely absent from the DOM while presenting (not just CSS-hidden), that the
      # popout control opens a real separate window, and that edits made there reach the
      # presenting window's Pricing slide through the real backend — not direct
      # window-to-window messaging.
      - name: Run live notes-window E2E against the deployment
        working-directory: infra/e2e
        run: node notes-window-e2e.mjs
        env:
          BASE_URL: ${{ needs.deploy.outputs.web_url }}

      # Send to Client: Download PDF. Reuses the seeded Amazon DSP deck (safe — Discovery
      # Notes session state lives on a fresh per-visit Meeting row, never the shared deck
      # config), sets a known driver value and service selection, downloads the live quote
      # PDF from the Send to Client dialog, and confirms via real PDF text extraction that
      # it reflects the actual current session state — not a cached or default one. Only
      # needs the seeded demo/admin account, so it runs standalone.
      - name: Run live send-to-client-pdf E2E against the deployment
        working-directory: infra/e2e
        run: node send-to-client-pdf-e2e.mjs
        env:
          BASE_URL: ${{ needs.deploy.outputs.web_url }}

      # Team & Role Management (Phase 2c): creates one QA test user per non-admin role
      # through the real Team Management screen (Admin), then confirms — via raw HTTP
      # calls to the API, bypassing the web UI entirely — that every permission each role
      # lacks is genuinely rejected with FORBIDDEN, and everything it has succeeds.
      - name: Run live role-enforcement E2E against the deployment
        working-directory: infra/e2e
        run: node role-enforcement-e2e.mjs
        env:
          BASE_URL: ${{ needs.deploy.outputs.web_url }}
          API_URL: ${{ needs.deploy.outputs.api_url }}

      # Pricing editing in Edit Deck (Phase 5b). Creates its own dedicated fixture deck via
      # a raw API call (kept separate from wizard-e2e.mjs's Harbor Lane Dental fixture, since
      # this suite repeatedly overwrites pricing). Depends on role-enforcement-e2e.mjs above
      # for the QA Operations Manager account, used to confirm the pricing section inherits
      # Edit Deck's existing role check rather than adding a separate one.
      - name: Run live pricing-edit E2E against the deployment
        working-directory: infra/e2e
        run: node pricing-edit-e2e.mjs
        env:
          BASE_URL: ${{ needs.deploy.outputs.web_url }}
          API_URL: ${{ needs.deploy.outputs.api_url }}

      # Meeting Records (Phase 5a). Creates its own dedicated fixture deck via a raw API
      # call, saves a real Discovery Notes session as a Meeting Record, confirms the
      # list/search/filters on /meeting-records, downloads the text summary + regenerated
      # PDF, and — the core guarantee — edits the fixture deck's pricing AFTER the record
      # was saved and confirms the record's listed total and both downloads still reflect
      # the OLD frozen pricing, never the deck's current config. Depends on
      # role-enforcement-e2e.mjs above for the QA Operations Manager account, used to
      # confirm meetingRecords (deliberately narrower than discoveryNotes) blocks that role.
      - name: Run live meeting-records E2E against the deployment
        working-directory: infra/e2e
        run: node meeting-records-e2e.mjs
        env:
          BASE_URL: ${{ needs.deploy.outputs.web_url }}
          API_URL: ${{ needs.deploy.outputs.api_url }}

      # Archive system: soft-delete (archivedAt) for decks and meeting records, Home's
      # 3-dot menu, Meeting Records' Delete, and the Admin-only Archived Files screen.
      # Creates and genuinely destroys its own uniquely-named throwaway deck + meeting
      # record — unlike every other suite's fixture, this one is never reused across runs.
      # Depends on role-enforcement-e2e.mjs above for the QA Sales Executive account, used
      # to confirm every archive-management procedure is genuinely rejected at the API
      # level for a non-Admin, not just kept off the /archived screen.
      - name: Run live archive E2E against the deployment
        working-directory: infra/e2e
        run: node archive-e2e.mjs
        env:
          BASE_URL: ${{ needs.deploy.outputs.web_url }}
          API_URL: ${{ needs.deploy.outputs.api_url }}

      # AI-assisted deck drafting (Phase 3a). Skips itself (not the job — a skip, not a
      # failure) when ANTHROPIC_API_KEY hasn't been added as a repo secret yet, since
      # ai.draftDeck is then correctly disabled rather than broken. Confirms the real
      # feature end to end: a real Anthropic call produces a draft that loads into the
      # wizard, nothing is saved until Save, exceeding the rate limit is genuinely
      # rejected, and the browser network tab never carries the API key or an Anthropic
      # request.
      - name: Run live AI-drafting E2E against the deployment
        if: needs.deploy.outputs.ai_configured == 'true'
        working-directory: infra/e2e
        run: node ai-draft-e2e.mjs
        env:
          BASE_URL: ${{ needs.deploy.outputs.web_url }}
          API_URL: ${{ needs.deploy.outputs.api_url }}

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: infra/e2e/e2e-artifacts/
          if-no-files-found: ignore
