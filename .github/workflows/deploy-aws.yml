name: Deploy to AWS

# Pushes to main build both images from their Dockerfiles (never an auto-detected
# buildpack — see apps/*/Dockerfile), push to ECR, and deploy to App Runner. Also
# runnable manually (workflow_dispatch) — the underlying script is fully idempotent, so
# re-running it is how the one-time infrastructure bootstrap (RDS, ElastiCache, IAM,
# VPC connector) happens too: there's a single script, not a separate one-off setup path.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      web_url: ${{ steps.deploy.outputs.web_url }}
      api_url: ${{ steps.deploy.outputs.api_url }}
      ai_configured: ${{ steps.deploy.outputs.ai_configured }}
      azure_configured: ${{ steps.deploy.outputs.azure_configured }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Provision (idempotent) + build + deploy
        id: deploy
        # GitHub's default shell for a `run:` block is `bash -e {0}` — no `pipefail` — so
        # `deploy.sh | tee log` would report tee's exit code (always 0), silently masking
        # a real failure in deploy.sh. Setting pipefail explicitly is what makes this step
        # actually fail when the script does, instead of printing a blank summary and a
        # green checkmark (which is exactly what happened before this was added).
        run: |
          set -euo pipefail
          ./infra/aws/deploy.sh | tee /tmp/deploy.log
          API_URL=$(grep -oP '(?<= api: )\S+' /tmp/deploy.log | tail -1)
          WEB_URL=$(grep -oP '(?<= web: )\S+' /tmp/deploy.log | tail -1)
          AI_CONFIGURED=$(grep -oP '(?<= ai_configured: )\S+' /tmp/deploy.log | tail -1)
          AZURE_CONFIGURED=$(grep -oP '(?<= azure_configured: )\S+' /tmp/deploy.log | tail -1)
          if [ -z "$API_URL" ] || [ -z "$WEB_URL" ]; then
            echo "::error::deploy.sh reported success but didn't print both service URLs — treating as a failure."
            exit 1
          fi
          {
            echo "## Deployed"
            echo "- api: $API_URL"
            echo "- web: $WEB_URL"
            echo "- AI drafting configured: ${AI_CONFIGURED:-false}"
            echo "- Microsoft sign-in configured: ${AZURE_CONFIGURED:-false}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "web_url=$WEB_URL" >> "$GITHUB_OUTPUT"
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "ai_configured=${AI_CONFIGURED:-false}" >> "$GITHUB_OUTPUT"
          echo "azure_configured=${AZURE_CONFIGURED:-false}" >> "$GITHUB_OUTPUT"
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          # Phase 3a (AI-assisted deck drafting). Optional on purpose: deploy.sh stores
          # this in SSM only when it's set, and reuses whatever's already stored otherwise
          # — so a repo without this secret still deploys fine, just with AI drafting
          # disabled (ai.draftDeck returns a clear "not configured" error) until it's added.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Phase 4a Part 1 ("Sign in with Microsoft"). Same optional-until-configured
          # pattern as ANTHROPIC_API_KEY: all three are needed together before Microsoft
          # sign-in counts as configured (see deploy.sh) — until then it stays hidden
          # (auth.config reports microsoftEnabled: false) rather than failing the deploy.
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

  # Live end-to-end checks against the deployment that just went out, through a real
  # browser. Both scripts are idempotent (see their own headers) so re-deploys don't pile
  # up duplicate test data — this is the permanent "verify live, not just a green build"
  # gate: a deploy whose app is broken (wizard, pricing, or role enforcement) fails here
  # instead of looking green.
  live-e2e:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # E2E_TEST_SECRET can't travel through deploy's job outputs: GitHub Actions silently
      # drops any output value that matches a registered ::add-mask:: (secrets aren't allowed
      # to cross job boundaries that way — see the "Skip output ... since it may contain
      # secret" warning this used to produce), so the password-reset step below always saw
      # an empty value. Fetching it here, directly from the same SSM parameter deploy.sh
      # generates it into, avoids that path entirely.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Fetch E2E_TEST_SECRET from SSM
        run: |
          set -euo pipefail
          SECRET="$(aws ssm get-parameter --name /aeon/E2E_TEST_SECRET --with-decryption --query 'Parameter.Value' --output text)"
          echo "::add-mask::$SECRET"
          echo "E2E_TEST_SECRET=$SECRET" >> "$GITHUB_ENV"

      - name: Install Playwright
        working-directory: infra/e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium --with-deps

      # Every suite below sets continue-on-error: true and gets an id — an unexpected
      # exception in one suite (a broken assertion, a wrong fixture assumption, a
      # navigation timeout) must not prevent unrelated suites from running at all, the way
      # a plain step failure would by stopping the rest of the job. The final "Summarize"
      # step (if: always()) reads every outcome and fails the JOB if any suite failed, so
      # this stays a real gate — it just stops one suite's crash from hiding whether every
      # other suite passed.
      - name: Run live wizard E2E against the deployment
        id: wizard
        continue-on-error: true
        working-directory: infra/e2e
        run: node wizard-e2e.mjs
        env:
          BASE_URL: ${{ needs.deploy.outputs.web_url }}

      # Discovery Questions: Toggle generalized from exactly-two hardcoded options to the
      # same add/remove option-list UI Select already had, plus four new answer types
      # (Multiple Select, Date, Email, Phone — Number turned out to already exist end to
      # end). Adds one question of each in the wizard, then actually answers every one of
      # them in the real popped-out Discovery Notes window and confirms the answers
      # persisted correctly via a raw meeting.get call — not just that the DOM looked right.
      - name: Run live discovery-questions E2E against the deployment
        id: discovery-questions
        continue-on-error: true
        working-directory: infra/e2e
        run: node discovery-questions-e2e.mjs
        env:
          BASE_URL: ${{ needs.deploy.outputs.web_url }}
          API_URL: ${{ needs.deploy.outputs.api_url }}

      # About/Challenges/Benefits redesign + per-service Services-slide tagline. Reads
      # only the seeded Amazon DSP, Meridian, and FedEx P&D decks (never mutates them), so
      # it's safe to run standalone against every deploy — confirms each deck's own real
      # content renders in the new layouts (not Amazon's copy leaking onto other decks) and
      # that the wizard's "Delivering team" field is untouched by the additive tagline field.
      - name: Run live redesign-content E2E against the deployment
        id: redesign-content
        continue-on-error: true
        working-directory: infra/e2e
        run: node redesign-content-e2e.mjs
        env:
          BASE_URL: ${{ needs.deploy.outputs.web_url }}

      # Report-sample template redesign (Templates A/B/C — see packages/types/src/deck.ts
      # ReportTemplate). Makes no assertions of its own — it only captures real screenshots
      # of the affected Amazon DSP report slides (Worker Comp Validation now under Driver
      # Compliance Management, the new Unemployment Claims/CDF/DSB/Dispatch Tracking
      # reports, and the wizard's multi-report list) so they can be reviewed visually
      # against the reference designs, uploaded always (not just on failure) as a
      # dedicated artifact.
      - name: Run live report-template screenshots against the deployment
        id: report-template-screenshots
        continue-on-error: true
        working-directory: infra/e2e
        run: node report-templates-screenshots.mjs
        env:
          BASE_URL: ${{ needs.deploy.outputs.web_url }}

      - name: Upload live report-template screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-report-screenshots
          path: infra/e2e/e2e-artifacts/report-screenshots/
          if-no-files-found: ignore

      # Slide visual-system consistency audit: Cover, How We Work, the per-service
      # intro+detail pair, and Q&A were left on an older, flatter treatment after the
      # About/Challenges/Benefits redesign — this checks each now matches its intended
      # pattern (dark-gradient / light / split light+dark), structurally AND with real
      # screenshots for visual review, across all three seeded decks.
      - name: Run live slide-system E2E against the deployment
        id: slide-system
        continue-on-error: true
        working-directory: infra/e2e
        run: node slide-system-screenshots.mjs
        env:
          BASE_URL: ${{ needs.deploy.outputs.web_url }}

      - name: Upload live slide-system screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-slide-system-screenshots
          path: infra/e2e/e2e-artifacts/slide-system-screenshots/
          if-no-files-found: ignore

      # Present-mode Discovery Notes popout window (safety fix): confirms Discovery Notes
      # is genuinely absent from the DOM while presenting (not just CSS-hidden), that the
      # popout control opens a real separate window, and that edits made there reach the
      # presenting window's Pricing slide through the real backend — not direct
      # window-to-window messaging.
      - name: Run live notes-window E2E against the deployment
        id: notes-window
        continue-on-error: true
        working-directory: infra/e2e
        run: node notes-window-e2e.mjs
        env:
          BASE_URL: ${{ needs.deploy.outputs.web_url }}

      # Send to Client: Download PDF. Reuses the seeded Amazon DSP deck (safe — Discovery
      # Notes session state lives on a fresh per-visit Meeting row, never the shared deck
      # config), sets a known driver value and service selection, downloads the live quote
      # PDF from the Send to Client dialog, and confirms via real PDF text extraction that
      # it reflects the actual current session state — not a cached or default one. Only
      # needs the seeded demo/admin account, so it runs standalone.
      - name: Run live send-to-client-pdf E2E against the deployment
        id: send-to-client-pdf
        continue-on-error: true
        working-directory: infra/e2e
        run: node send-to-client-pdf-e2e.mjs
        env:
          BASE_URL: ${{ needs.deploy.outputs.web_url }}

      # Team & Role Management (Phase 2c): creates one QA test user per non-admin role
      # through the real Team Management screen (Admin), then confirms — via raw HTTP
      # calls to the API, bypassing the web UI entirely — that every permission each role
      # lacks is genuinely rejected with FORBIDDEN, and everything it has succeeds.
      - name: Run live role-enforcement E2E against the deployment
        id: role-enforcement
        continue-on-error: true
        working-directory: infra/e2e
        run: node role-enforcement-e2e.mjs
        env:
          BASE_URL: ${{ needs.deploy.outputs.web_url }}
          API_URL: ${{ needs.deploy.outputs.api_url }}

      # Forgot Password + New User Invitation — both flows share one single-use, expiring
      # token mechanism. Uses auth.e2eRequestToken (gated on E2E_TEST_SECRET, generated by
      # deploy.sh, and restricted to @aeonqa.internal accounts) to obtain a real token
      # without needing a real inbox, while still exercising real SES delivery, the real
      # reset-password screen, and a real login with the new password end to end.
      - name: Run live password-reset E2E against the deployment
        id: password-reset
        continue-on-error: true
        working-directory: infra/e2e
        run: node password-reset-e2e.mjs
        env:
          BASE_URL: ${{ needs.deploy.outputs.web_url }}
          API_URL: ${{ needs.deploy.outputs.api_url }}
          E2E_TEST_SECRET: ${{ env.E2E_TEST_SECRET }}

      # Pricing editing in Edit Deck (Phase 5b). Creates its own dedicated fixture deck via
      # a raw API call (kept separate from wizard-e2e.mjs's Harbor Lane Dental fixture, since
      # this suite repeatedly overwrites pricing). Depends on role-enforcement-e2e.mjs above
      # for the QA Operations Manager account, used to confirm the pricing section inherits
      # Edit Deck's existing role check rather than adding a separate one.
      - name: Run live pricing-edit E2E against the deployment
        id: pricing-edit
        continue-on-error: true
        working-directory: infra/e2e
        run: node pricing-edit-e2e.mjs
        env:
          BASE_URL: ${{ needs.deploy.outputs.web_url }}
          API_URL: ${{ needs.deploy.outputs.api_url }}

      # Meeting Records (Phase 5a). Creates its own dedicated fixture deck via a raw API
      # call, saves a real Discovery Notes session as a Meeting Record, confirms the
      # list/search/filters on /meeting-records, downloads the text summary + regenerated
      # PDF, and — the core guarantee — edits the fixture deck's pricing AFTER the record
      # was saved and confirms the record's listed total and both downloads still reflect
      # the OLD frozen pricing, never the deck's current config. Depends on
      # role-enforcement-e2e.mjs above for the QA Operations Manager account, used to
      # confirm meetingRecords (deliberately narrower than discoveryNotes) blocks that role.
      - name: Run live meeting-records E2E against the deployment
        id: meeting-records
        continue-on-error: true
        working-directory: infra/e2e
        run: node meeting-records-e2e.mjs
        env:
          BASE_URL: ${{ needs.deploy.outputs.web_url }}
          API_URL: ${{ needs.deploy.outputs.api_url }}

      # Archive system: soft-delete (archivedAt) for decks and meeting records, Home's
      # 3-dot menu, Meeting Records' Delete, and the Admin-only Archived Files screen.
      # Creates and genuinely destroys its own uniquely-named throwaway deck + meeting
      # record — unlike every other suite's fixture, this one is never reused across runs.
      # Depends on role-enforcement-e2e.mjs above for the QA Sales Executive account, used
      # to confirm every archive-management procedure is genuinely rejected at the API
      # level for a non-Admin, not just kept off the /archived screen.
      - name: Run live archive E2E against the deployment
        id: archive
        continue-on-error: true
        working-directory: infra/e2e
        run: node archive-e2e.mjs
        env:
          BASE_URL: ${{ needs.deploy.outputs.web_url }}
          API_URL: ${{ needs.deploy.outputs.api_url }}

      # AI-assisted deck drafting (Phase 3a). Skips itself (not the job — a skip, not a
      # failure) when ANTHROPIC_API_KEY hasn't been added as a repo secret yet, since
      # ai.draftDeck is then correctly disabled rather than broken. Confirms the real
      # feature end to end: a real Anthropic call produces a draft that loads into the
      # wizard, nothing is saved until Save, exceeding the rate limit is genuinely
      # rejected, and the browser network tab never carries the API key or an Anthropic
      # request.
      - name: Run live AI-drafting E2E against the deployment
        id: ai-drafting
        continue-on-error: true
        if: needs.deploy.outputs.ai_configured == 'true'
        working-directory: infra/e2e
        run: node ai-draft-e2e.mjs
        env:
          BASE_URL: ${{ needs.deploy.outputs.web_url }}
          API_URL: ${{ needs.deploy.outputs.api_url }}
          E2E_TEST_SECRET: ${{ env.E2E_TEST_SECRET }}

      # Custom report authoring (Services step — "Report & Sample slides"): uploads a real
      # image straight to S3 via a presigned URL and confirms it renders at its real aspect
      # ratio, generates a real custom report from a plain-English description via
      # ai.draftReport and confirms it renders as genuinely custom HTML/CSS inside a
      # sandboxed iframe (not any of Templates A/B/C's own markup), confirms a service with
      # 5 reports correctly paginates onto a second slide instead of cropping, and confirms
      # Remove still works. Gated the same as ai-drafting above — the AI-generate half of
      # this suite needs the same configured ANTHROPIC_API_KEY.
      - name: Run live report-authoring E2E against the deployment
        id: report-authoring
        continue-on-error: true
        if: needs.deploy.outputs.ai_configured == 'true'
        working-directory: infra/e2e
        run: node report-authoring-e2e.mjs
        env:
          BASE_URL: ${{ needs.deploy.outputs.web_url }}
          API_URL: ${{ needs.deploy.outputs.api_url }}

      - name: Upload live report-authoring screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-report-authoring-screenshots
          path: infra/e2e/e2e-artifacts/report-authoring/
          if-no-files-found: ignore

      # Reads back every suite's outcome above (each ran regardless of its siblings'
      # results, via continue-on-error) and fails the JOB if any suite failed or crashed —
      # this is what keeps continue-on-error from silently turning the whole gate green.
      - name: Summarize live-e2e results
        if: always()
        run: |
          declare -A OUTCOMES=(
            [wizard]="${{ steps.wizard.outcome }}"
            [discovery-questions]="${{ steps.discovery-questions.outcome }}"
            [redesign-content]="${{ steps.redesign-content.outcome }}"
            [report-template-screenshots]="${{ steps.report-template-screenshots.outcome }}"
            [slide-system]="${{ steps.slide-system.outcome }}"
            [notes-window]="${{ steps.notes-window.outcome }}"
            [send-to-client-pdf]="${{ steps.send-to-client-pdf.outcome }}"
            [role-enforcement]="${{ steps.role-enforcement.outcome }}"
            [password-reset]="${{ steps.password-reset.outcome }}"
            [pricing-edit]="${{ steps.pricing-edit.outcome }}"
            [meeting-records]="${{ steps.meeting-records.outcome }}"
            [archive]="${{ steps.archive.outcome }}"
            [ai-drafting]="${{ steps.ai-drafting.outcome }}"
            [report-authoring]="${{ steps.report-authoring.outcome }}"
          )
          failed=0
          for name in "${!OUTCOMES[@]}"; do
            outcome="${OUTCOMES[$name]}"
            echo "$name: $outcome"
            if [ "$outcome" = "failure" ]; then
              echo "::error::live-e2e suite '$name' failed"
              failed=1
            fi
          done
          if [ "$failed" = "1" ]; then
            echo "One or more live-e2e suites failed — see the ::error:: annotations above."
            exit 1
          fi
          echo "All live-e2e suites passed (or were intentionally skipped)."

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: infra/e2e/e2e-artifacts/
          if-no-files-found: ignore
